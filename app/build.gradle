apply plugin: 'com.android.application'

def cfg = rootProject.ext.android
Properties localProperties = new Properties()
InputStream localPropertiesInputStream = project.rootProject.file('local.properties').newDataInputStream()
localProperties.load(localPropertiesInputStream)

android {
    compileSdkVersion cfg.compileSdkVersion
    buildToolsVersion cfg.buildToolsVersion
    defaultConfig {
        applicationId "com.chinashb.www.mobileerp"
        minSdkVersion cfg.minSdkVersion
        targetSdkVersion cfg.targetSdkVersion
        versionCode cfg.versionCode
        versionName cfg.versionName

        dexOptions {
            javaMaxHeapSize "8g"
//            preDexLibraries false
        }
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        //加载资源
        //读取文件
        def sdkDir = localProperties.getProperty('key.file')
        //读取字段
        def key_keyAlias = localProperties.getProperty('keyAlias')
        def key_keyPassword = localProperties.getProperty('keyPassword');
        def key_storePassword = localProperties.getProperty('storePassword');

        release {
            keyAlias key_keyAlias
            keyPassword key_keyPassword
            storeFile file(sdkDir)
            storePassword key_storePassword
        }
        debug {
            keyAlias key_keyAlias
            keyPassword key_keyPassword
            storeFile file(sdkDir)
            storePassword key_storePassword
        }
    }

    //要加上这段，否则点assembleRelease生成的是app-unsinged-apk,并且放在signingConfigs 配置的下面
    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            minifyEnabled false
//            manifestPlaceholders = [
//                    Jpush_AppKey: "b30593265e19dc5b635b223e"
//            ]
        }
        debug {
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            minifyEnabled false

//            manifestPlaceholders = [
//                    Jpush_AppKey: "2cae1866b303ea72d1980d2c"
//            ]
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
//        main {
//            jniLibs.srcDirs = ['libs', 'src/main/jniLibs']
//            java.srcDirs = ['src/main/java', '../generated-src/java']
//
//            res.srcDirs = [
//                    'src/main/res',
//                    'src/main/res/anim',
//
//                    'src/main/res/values',
//
//                    'src/main/res/layout',
//                    'src/main/res/layout/home',
//
//
//                    'src/main/res/drawable',
//
//
//            ]
//        }
    }

    productFlavors {
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
}
